name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Validate pinned Nordic44-2015 DC baseline
        run: python scripts/run_dc_baseline.py
      - name: Generate validation figures
        run: python scripts/make_dc_baseline_plots.py
      - uses: actions/upload-artifact@v4
        with:
          name: dc-baseline
          path: artifacts/
